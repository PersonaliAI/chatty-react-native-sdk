name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build, publish & release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Same tarball `npm publish` would upload — gives every release a
      # downloadable build artifact even before npm publishing is enabled.
      - name: Pack tarball
        run: npm pack

      # Requires an NPM_TOKEN repo secret (npm access token with publish
      # rights for the @personaliai org) — skipped automatically until set.
      - name: Publish to npm
        if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "*.tgz"

  example-apk:
    name: Build example app APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build SDK
        run: npm ci && npm run build

      - name: Install example app dependencies
        working-directory: example
        run: npm install --no-audit --no-fund

      # example/ is a bare Expo-managed app (no android/ios folders checked
      # in) — prebuild generates a real native Android project from app.json
      # so it can be built with a plain Gradle wrapper, no EAS account needed.
      - name: Expo prebuild (Android)
        working-directory: example
        run: npx expo prebuild --platform android --no-install

      # Release (not debug) — a debug build doesn't embed the JS bundle, it
      # expects a live Metro server, which produced "Could not connect to
      # development server" for anyone who just installed the APK standalone.
      # Release bundles JS into the APK at build time via the RN Gradle
      # plugin's bundleReleaseJsAndAssets task, and Expo's generated project
      # falls back to the debug keystore when no release signing config is
      # set, so this still produces an installable (if not Play-signed) APK.
      - name: Build release APK
        working-directory: example/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK
        run: cp example/android/app/build/outputs/apk/release/app-release.apk chatty-react-native-example.apk

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: chatty-react-native-example.apk

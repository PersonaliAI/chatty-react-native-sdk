name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build, publish & release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Same tarball `npm publish` would upload — gives every release a
      # downloadable build artifact even before npm publishing is enabled.
      - name: Pack tarball
        run: npm pack

      # Requires an NPM_TOKEN repo secret (npm access token with publish
      # rights for the @personaliai org) — skipped automatically until set.
      - name: Publish to npm
        if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "*.tgz"

  example-apk:
    name: Build example app APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build SDK
        run: npm ci && npm run build

      - name: Install example app dependencies
        working-directory: example
        run: npm install --no-audit --no-fund

      # example/ is a bare Expo-managed app (no android/ios folders checked
      # in) — prebuild generates a real native Android project from app.json
      # so it can be built with a plain Gradle wrapper, no EAS account needed.
      - name: Expo prebuild (Android)
        working-directory: example
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: example/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp example/android/app/build/outputs/apk/debug/app-debug.apk chatty-react-native-example.apk

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: chatty-react-native-example.apk
